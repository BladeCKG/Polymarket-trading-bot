<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beat Trader Dashboard</title>
  <style>
    :root {
      --bg: #f4efe4;
      --panel: rgba(255,255,255,0.74);
      --panel-strong: rgba(255,255,255,0.9);
      --text: #16211d;
      --muted: #58645e;
      --accent: #0f766e;
      --accent-soft: #d7f3ee;
      --profit: #1d4ed8;
      --profit-soft: rgba(59,130,246,0.14);
      --loss-soft: rgba(180,35,24,0.12);
      --danger: #b42318;
      --warn: #9a6700;
      --shadow: 0 18px 50px rgba(34, 54, 45, 0.14);
      --radius: 20px;
      --border: rgba(15, 118, 110, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Aptos", "Segoe UI Variable", "Trebuchet MS", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(15,118,110,0.18), transparent 32%),
        radial-gradient(circle at top right, rgba(218,165,32,0.18), transparent 28%),
        linear-gradient(180deg, #fbf7ef 0%, var(--bg) 100%);
      min-height: 100vh;
    }
    .shell { max-width: 1400px; margin: 0 auto; padding: 28px 20px 40px; }
    .hero { display: grid; gap: 16px; margin-bottom: 20px; padding: 22px; border-radius: 28px;
      background: linear-gradient(135deg, rgba(255,255,255,0.78), rgba(237,250,247,0.88));
      box-shadow: var(--shadow); border: 1px solid var(--border); backdrop-filter: blur(8px); }
    .hero h1 { margin: 0; font-size: clamp(2rem,4vw,3.25rem); line-height:1; letter-spacing:-0.04em; }
    .hero p { margin:0; color: var(--muted); max-width:68ch; }
    .banner { display:flex; gap:10px; flex-wrap:wrap; align-items:center; color: var(--muted); font-size:0.95rem; }
    .pill { display:inline-flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px; background: var(--accent-soft); color: var(--accent); font-weight:600; }
    .grid { display:grid; gap:16px; grid-template-columns: repeat(auto-fit, minmax(280px,1fr)); margin-bottom:18px; }
    .stat { padding:18px; border-radius:var(--radius); background:var(--panel-strong); box-shadow:var(--shadow); border:1px solid var(--border); }
    .stat .label { font-size:0.82rem; text-transform:uppercase; letter-spacing:0.08em; color:var(--muted); margin-bottom:6px; }
    .stat .value { font-size:2rem; font-weight:700; letter-spacing:-0.04em; }
    .sections { display:grid; gap:14px; grid-template-columns: minmax(0,1fr); }
    .sections > * { min-width:0; }
    details.panel { width:100%; border-radius:var(--radius); background:var(--panel); box-shadow:var(--shadow); border:1px solid var(--border); overflow:hidden; backdrop-filter:blur(8px); }
    details.panel[open] { background:var(--panel-strong); }
    details.panel > summary { list-style:none; cursor:pointer; padding:18px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; font-weight:700; font-size:1rem; }
    details.panel > summary::-webkit-details-marker { display:none; }
    .summary-meta { color:var(--muted); font-size:0.85rem; font-weight:500; }
    .panel-body { padding:0 20px 20px; }
    .list { display:grid; gap:10px; }
    .item { padding:14px; border-radius:16px; background:rgba(255,255,255,0.76); border:1px solid rgba(15,118,110,0.08); }
    .item header { display:flex; justify-content:space-between; gap:10px; margin-bottom:8px; font-weight:700; }
    .log-line { padding:12px 14px; border-radius:14px; background:rgba(255,255,255,0.7); border:1px solid rgba(15,118,110,0.08); font-family:"Consolas","IBM Plex Mono",monospace; font-size:0.84rem; }
    .log-line.info { border-left:4px solid var(--accent); }
    .log-line.warn { border-left:4px solid var(--warn); }
    .log-line.error { border-left:4px solid var(--danger); }
    .empty { padding:18px; color:var(--muted); border:1px dashed rgba(15,118,110,0.18); border-radius:16px; background:rgba(255,255,255,0.46); }
    @media (max-width:720px) { .shell{padding:16px 12px 28px;} details.panel > summary{padding:16px;} .panel-body{padding:0 16px 16px;} }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="banner">
        <span class="pill" id="connection">Connecting...</span>
        <span id="runtimeLabel">Beat Runtime Dashboard</span>
      </div>
      <h1>Real-time Beat Trader Control Room</h1>
      <p>Live runtime status, trade activity, and logs for the Beat strategy.</p>
    </section>
    <section class="grid" id="topStats"></section>
    <section class="sections" id="sections"></section>
  </div>
  <script>
    const state={runtime:{},stats:{},recentTrades:[],logs:[],markets:[],btcPrice:null};
    const topStatsEl=document.getElementById('topStats');
    const sectionsEl=document.getElementById('sections');
    const connectionEl=document.getElementById('connection');
    const runtimeLabelEl=document.getElementById('runtimeLabel');
    const dirty=new Set(['chrome','topStats','runtime','trades','logs','price','markets']);
    let renderScheduled=false;
    function money(v){const n=Number(v);return Number.isFinite(n)?'$'+n.toFixed(2):String(v||'-');}
    function ts(v){if(!v)return'-';const d=new Date(v);return Number.isNaN(d.getTime())?String(v):d.toLocaleTimeString();}
    function truncatePush(list,val,max){list.unshift(val);if(list.length>max)list.length=max;}
    function renderTop(){const cards=[["Spend",money(state.stats.totalSpent||0)],["PnL",money(state.stats.netPnl||0)],["Trades",state.stats.trades||0]];topStatsEl.innerHTML=cards.map(c=>`<article class="stat"><div class="label">${c[0]}</div><div class="value">${c[1]}</div></article>`).join('');}
    function renderRuntime(){return `<details class="panel" open><summary><span>Runtime</span><span class="summary-meta">${state.runtime.mode||''}</span></summary><div class="panel-body"><div class="stat"><div class="label">Wallet</div><div class="value">${state.runtime.wallet||''}</div></div><div class="stat"><div class="label">Dry Run</div><div class="value">${state.runtime.dryRun}</div></div><div class="stat"><div class="label">Started</div><div class="value">${ts(state.runtime.startedAt)}</div></div></div></details>`;}
    function renderTrades(){return `<details class="panel" open><summary><span>Recent Trades</span><span class="summary-meta">${state.recentTrades.length}</span></summary><div class="panel-body">${state.recentTrades.slice(0,100).map(t=>`<div class="item"><header><span>${t.slug||'?'}</span><span>${ts(t.seenAt)}</span></header><div>Price: ${t.price||'-'} USDC: ${t.usdc||'-'}</div></div>`).join('')}</div></details>`;}
    function renderLogs(){return `<details class="panel" open><summary><span>Logs</span><span class="summary-meta">${state.logs.length}</span></summary><div class="panel-body">${state.logs.slice(0,250).map(l=>`<div class="log-line ${l.level||'info'}">[${l.timestamp}] ${l.message||''}</div>`).join('')}</div></details>`;}
    function renderPrice(){return `<details class="panel" open><summary><span>BTC Price</span></summary><div class="panel-body"><div class="stat"><div class="label">USD</div><div class="value">${state.btcPrice!==null?`$${Number(state.btcPrice).toFixed(2)}`:'-'}</div></div></div></details>`;}
    function renderMarkets(){return `<details class="panel" open><summary><span>Markets</span><span class="summary-meta">${state.markets.length}</span></summary><div class="panel-body">${state.markets.slice(0,100).map(m=>`<div class="item"><header><span>${m.slug||'?'}</span><span>${ts(m.createdAt||m.seenAt)}</span></header><div>Price: ${m.price||'-'}</div></div>`).join('')}</div></details>`;}
    const renderers={runtime:renderRuntime,trades:renderTrades,price:renderPrice,markets:renderMarkets,logs:renderLogs};
    function scheduleRender(...keys){if(keys.length===0){dirty.add('chrome');dirty.add('topStats');for(const k of Object.keys(renderers))dirty.add(k);}else{keys.forEach(k=>dirty.add(k));}if(renderScheduled)return;renderScheduled=true;requestAnimationFrame(flushRender);}
    function flushRender(){renderScheduled=false;if(dirty.has('chrome')){connectionEl.textContent=state.runtime.connected?'Live':'Waiting';runtimeLabelEl.textContent=state.runtime.dashboardUrl||'Beat Runtime Dashboard';dirty.delete('chrome');}if(dirty.has('topStats')){renderTop();dirty.delete('topStats');}for(const k of Object.keys(renderers)){if(dirty.has(k)){sectionsEl.querySelector(`[data-section='${k}']`).innerHTML=renderers[k]();dirty.delete(k);}}
    }
    function initSections(){sectionsEl.innerHTML=Object.keys(renderers).map(k=>`<div data-section='${k}'></div>`).join('');}
    function handleEvent(type,data){if(type==='runtime'){state.runtime={...state.runtime,...data};scheduleRender('runtime','topStats');}else if(type==='stats'){state.stats={...state.stats,...data};scheduleRender('topStats');}else if(type==='trade'){state.recentTrades=[data,...state.recentTrades].slice(0,100);scheduleRender('trades');}else if(type==='log'){state.logs=[data,...state.logs].slice(0,250);scheduleRender('logs');}else if(type==='price'){state.btcPrice=data;scheduleRender('price');}else if(type==='market'){state.markets=[data,...state.markets].slice(0,100);scheduleRender('markets');}}
    const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
    ws.addEventListener('open',()=>{state.runtime.connected=true;scheduleRender();});
    ws.addEventListener('close',()=>{state.runtime.connected=false;scheduleRender();});
    ws.addEventListener('message',e=>{const p=JSON.parse(e.data);if(p.type==='snapshot'){Object.assign(state,p.data);scheduleRender();}else{handleEvent(p.type,p.data);}});
    initSections();scheduleRender();
  </script>
</body>
</html>
