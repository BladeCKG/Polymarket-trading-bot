<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Beat Trader Dashboard</title>
  <style>
    :root {
      --bg: #f4efe4;
      --ink: #14201c;
      --muted: #5b675f;
      --panel: rgba(255, 255, 255, 0.72);
      --panel-strong: rgba(255, 255, 255, 0.9);
      --border: rgba(17, 94, 89, 0.12);
      --shadow: 0 18px 50px rgba(34, 54, 45, 0.14);
      --accent: #0f766e;
      --accent-soft: rgba(15, 118, 110, 0.12);
      --good: #166534;
      --good-soft: rgba(22, 101, 52, 0.12);
      --bad: #b42318;
      --bad-soft: rgba(180, 35, 24, 0.12);
      --warn: #9a6700;
      --warn-soft: rgba(154, 103, 0, 0.12);
      --radius: 22px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Aptos", "Segoe UI Variable", "Trebuchet MS", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(15, 118, 110, 0.18), transparent 30%),
        radial-gradient(circle at top right, rgba(218, 165, 32, 0.16), transparent 26%),
        linear-gradient(180deg, #fbf7ef 0%, var(--bg) 100%);
    }

    .shell {
      max-width: 1460px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .hero {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.8), rgba(237, 250, 247, 0.9));
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      margin-bottom: 18px;
      display: grid;
      gap: 16px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.74rem;
      font-weight: 700;
      color: var(--accent);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.6rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .hero p {
      margin: 0;
      max-width: 78ch;
      color: var(--muted);
      line-height: 1.5;
    }

    .banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 14px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid rgba(15, 118, 110, 0.16);
      font-weight: 700;
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      margin-bottom: 16px;
    }

    .stat {
      padding: 16px 18px;
      border-radius: 20px;
      background: var(--panel-strong);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      min-height: 104px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .stat .label {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .stat .value {
      font-size: clamp(1.4rem, 2vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.05em;
      margin-top: 10px;
    }

    .stat .hint {
      font-size: 0.84rem;
      color: var(--muted);
      margin-top: 6px;
    }

    .sections {
      display: grid;
      gap: 16px;
    }

    .live-section-layout {
      display: grid;
      gap: 16px;
      grid-template-columns: minmax(0, 1fr) 560px;
      align-items: start;
      width: min(calc(100vw - 40px), 2200px);
      margin-left: calc(50% - 50vw + 20px);
      margin-right: calc(50% - 50vw + 20px);
    }

    .sections-main {
      display: grid;
      gap: 16px;
      min-width: 0;
    }

    .centered-stack {
      max-width: 1460px;
      width: 100%;
      margin: 0 auto;
    }

    .sections-side {
      display: grid;
      gap: 16px;
      align-content: start;
      min-width: 0;
    }

    .panel {
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(8px);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 18px 20px 14px;
    }

    .panel-title {
      margin: 0;
      font-size: 1.05rem;
      letter-spacing: -0.02em;
    }

    .panel-subtitle {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .panel-toggle {
      border: 1px solid rgba(15, 118, 110, 0.18);
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .panel-body.is-collapsed {
      display: none;
    }

    .panel-body {
      padding: 0 20px 20px;
    }

    .market-column {
      display: grid;
      gap: 14px;
    }

    .market-card {
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.84);
      border: 1px solid rgba(15, 118, 110, 0.12);
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .market-card.settled {
      border-color: rgba(22, 101, 52, 0.18);
      background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(242,250,245,0.94));
    }

    .market-card.empty {
      border-style: dashed;
      color: var(--muted);
      background: rgba(255,255,255,0.46);
    }

    .market-head {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .market-name {
      min-width: 0;
    }

    .market-name h3 {
      margin: 6px 0 0;
      font-size: 1.02rem;
      letter-spacing: -0.03em;
      word-break: break-word;
    }

    .slug-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .copy-slug-btn {
      border: 1px solid rgba(15, 118, 110, 0.18);
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
      border-radius: 8px;
      padding: 3px 8px;
      font-size: 0.72rem;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      flex: none;
    }

    .copy-slug-btn:hover {
      border-color: rgba(15, 118, 110, 0.42);
    }

    .copy-slug-btn.copied {
      background: var(--good-soft);
      color: var(--good);
      border-color: rgba(22, 101, 52, 0.35);
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }

    .status-chip.live { background: var(--accent-soft); color: var(--accent); }
    .status-chip.settled { background: var(--good-soft); color: var(--good); }
    .status-chip.waiting { background: var(--warn-soft); color: var(--warn); }
    .status-chip.error { background: var(--bad-soft); color: var(--bad); }

    .market-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .metric-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }

    .metric {
      padding: 12px 13px;
      border-radius: 16px;
      background: rgba(15, 118, 110, 0.05);
      border: 1px solid rgba(15, 118, 110, 0.08);
    }

    .metric .label {
      color: var(--muted);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .metric .value {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .metric .value.small {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .metric .subvalue {
      margin-top: 4px;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .market-graphs {
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .monitoring-graphs-panel {
      position: sticky;
      top: 18px;
    }

    .graph-card {
      min-height: 300px;
      padding: 16px 18px 14px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(248, 252, 251, 0.98), rgba(238, 247, 244, 0.92));
      border: 1px solid rgba(15, 118, 110, 0.12);
      display: grid;
      gap: 14px;
    }

    .graph-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .graph-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 800;
    }

    .graph-meta {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .graph-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 10px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 999px;
    }

    .graph-svg {
      width: 100%;
      height: 228px;
      display: block;
      overflow: visible;
    }

    .graph-shell {
      position: relative;
      min-height: 228px;
    }

    .graph-empty {
      height: 228px;
      display: grid;
      place-items: center;
      color: var(--muted);
      border-radius: 14px;
      border: 1px dashed rgba(15, 118, 110, 0.18);
      background: rgba(255, 255, 255, 0.66);
      font-size: 0.84rem;
    }

    .graph-axis-label {
      font-size: 10px;
      fill: var(--muted);
    }

    .graph-axis-line {
      stroke: rgba(20, 32, 28, 0.16);
      stroke-width: 1;
    }

    .graph-axis-line.center {
      stroke: rgba(20, 32, 28, 0.36);
      stroke-dasharray: 4 4;
    }

    .graph-track {
      stroke: rgba(15, 118, 110, 0.10);
      stroke-width: 1;
    }

    .graph-line-move {
      stroke: #0f766e;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .graph-line-up {
      stroke: #166534;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .graph-line-down {
      stroke: #b42318;
      stroke-width: 2.5;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .graph-trade-line-directional {
      stroke: rgba(15, 118, 110, 0.55);
      stroke-width: 1.5;
      stroke-dasharray: 4 4;
    }

    .graph-trade-line-pair {
      stroke: rgba(180, 35, 24, 0.6);
      stroke-width: 1.5;
      stroke-dasharray: 2 3;
    }

    .graph-trade-line-force {
      stroke: rgba(217, 119, 6, 0.75);
      stroke-width: 1.5;
      stroke-dasharray: 1 2;
    }

    .graph-trade-label {
      font-size: 9px;
      fill: var(--ink);
      font-weight: 700;
    }

    .graph-trade-badge-directional {
      fill: rgba(15, 118, 110, 0.12);
      stroke: rgba(15, 118, 110, 0.35);
    }

    .graph-trade-badge-pair {
      fill: rgba(180, 35, 24, 0.12);
      stroke: rgba(180, 35, 24, 0.35);
    }

    .graph-trade-badge-force {
      fill: rgba(217, 119, 6, 0.14);
      stroke: rgba(217, 119, 6, 0.4);
    }

    .trade-chip.force {
      background: rgba(217, 119, 6, 0.10);
      color: #b45309;
      border-color: rgba(217, 119, 6, 0.3);
    }

    .settlement {
      display: grid;
      gap: 12px;
      padding-top: 2px;
      border-top: 1px solid rgba(15, 118, 110, 0.08);
    }

    .settlement .title {
      font-size: 0.86rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 700;
    }

    .settlement-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }

    .summary-box {
      padding: 14px;
      border-radius: 18px;
      border: 1px solid rgba(22, 101, 52, 0.12);
      background: rgba(22, 101, 52, 0.04);
    }

    .summary-box .label {
      color: var(--muted);
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .summary-box .value {
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .summary-box .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.4;
    }

    .buy-history {
      display: grid;
      gap: 10px;
      padding-top: 4px;
    }

    .buy-history .title {
      font-size: 0.86rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      font-weight: 700;
    }

    .buy-list {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .buy-item {
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(15, 118, 110, 0.12);
      background: rgba(15, 118, 110, 0.04);
      display: grid;
      gap: 6px;
    }

    .buy-item.paired {
      background: rgba(22, 101, 52, 0.06);
      border-color: rgba(22, 101, 52, 0.2);
    }

    .buy-item.unpaired {
      background: rgba(180, 35, 24, 0.06);
      border-color: rgba(180, 35, 24, 0.18);
    }

    .buy-item.paired {
      background: rgba(22, 101, 52, 0.06);
      border-color: rgba(22, 101, 52, 0.2);
    }

    .buy-item.unpaired {
      background: rgba(180, 35, 24, 0.06);
      border-color: rgba(180, 35, 24, 0.18);
    }

    .buy-item .head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: baseline;
      flex-wrap: wrap;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .buy-item .meta {
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }

    .trade-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .trade-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      border: 1px solid rgba(15, 118, 110, 0.12);
      background: rgba(255, 255, 255, 0.8);
      color: var(--ink);
    }

    .trade-chip.directional {
      background: rgba(15, 118, 110, 0.08);
      color: var(--accent);
      border-color: rgba(15, 118, 110, 0.18);
    }

    .trade-chip.pair {
      background: rgba(180, 35, 24, 0.08);
      color: var(--bad);
      border-color: rgba(180, 35, 24, 0.18);
    }

    .trade-chip.good {
      background: rgba(22, 101, 52, 0.08);
      color: var(--good);
      border-color: rgba(22, 101, 52, 0.18);
    }

    .trade-chip.warn {
      background: rgba(180, 35, 24, 0.08);
      color: var(--bad);
      border-color: rgba(180, 35, 24, 0.18);
    }

    .trade-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .trade-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      border: 1px solid rgba(15, 118, 110, 0.12);
      background: rgba(255, 255, 255, 0.8);
      color: var(--ink);
    }

    .trade-chip.directional {
      background: rgba(15, 118, 110, 0.08);
      color: var(--accent);
      border-color: rgba(15, 118, 110, 0.18);
    }

    .trade-chip.pair {
      background: rgba(180, 35, 24, 0.08);
      color: var(--bad);
      border-color: rgba(180, 35, 24, 0.18);
    }

    .trade-chip.good {
      background: rgba(22, 101, 52, 0.08);
      color: var(--good);
      border-color: rgba(22, 101, 52, 0.18);
    }

    .trade-chip.warn {
      background: rgba(180, 35, 24, 0.08);
      color: var(--bad);
      border-color: rgba(180, 35, 24, 0.18);
    }

    .summary-positive { color: var(--good); }
    .summary-negative { color: var(--bad); }

    .log-list {
      display: grid;
      gap: 10px;
    }

    .log-line {
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(15, 118, 110, 0.08);
      font-family: "Consolas", "IBM Plex Mono", monospace;
      font-size: 0.84rem;
      line-height: 1.45;
    }

    .log-line.info { border-left: 4px solid var(--accent); }
    .log-line.warn { border-left: 4px solid var(--warn); }
    .log-line.error { border-left: 4px solid var(--bad); }

    .price-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }

    .price-table th,
    .price-table td {
      padding: 6px 4px;
      border-bottom: 1px solid rgba(15, 118, 110, 0.08);
      text-align: left;
      vertical-align: top;
    }

    .price-table th:last-child,
    .price-table td:last-child {
      text-align: right;
    }

    .price-table th {
      color: var(--muted);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .empty {
      padding: 18px;
      color: var(--muted);
      border: 1px dashed rgba(15, 118, 110, 0.18);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.46);
    }

    .config-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .config-editor {
      width: 100%;
      min-height: 260px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(15, 118, 110, 0.18);
      background: rgba(250, 252, 251, 0.96);
      color: var(--ink);
      font-family: "Consolas", "IBM Plex Mono", monospace;
      font-size: 0.84rem;
      line-height: 1.5;
      resize: vertical;
    }

    .config-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .config-button {
      border: 1px solid rgba(15, 118, 110, 0.18);
      background: var(--accent);
      color: white;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .config-button.secondary {
      background: rgba(255, 255, 255, 0.88);
      color: var(--ink);
    }

    .config-note {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .config-status {
      font-size: 0.9rem;
      color: var(--accent);
      min-height: 1.2em;
    }

    @media (max-width: 1120px) {
      .live-section-layout {
        grid-template-columns: 1fr;
        width: 100%;
        margin-left: 0;
        margin-right: 0;
      }

      .monitoring-graphs-panel {
        position: static;
      }
    }

    @media (max-width: 720px) {
      .shell { padding: 16px 12px 28px; }
      .hero { padding: 18px; }
      .panel-head, .panel-body { padding-left: 14px; padding-right: 14px; }
      .market-card { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="banner">
        <span class="pill" id="connection">Connecting...</span>
        <span class="pill" id="modeLabel">Beat Mode</span>
        <span id="runtimeLabel">Beat Runtime Dashboard</span>
      </div>
      <div>
        <div class="eyebrow">Realtime market room</div>
        <h1>Beat strategy live console</h1>
      </div>
      <p>Watch the live beat price, live Polymarket quotes, countdown to settlement, and the eventual settlement result without the dead trade panel cluttering the screen.</p>
    </section>

    <section class="grid" id="topStats"></section>
    <section class="panel" id="configPanel"></section>
    <section class="sections" id="sections"></section>
  </div>

  <script>
    const state = {
      runtime: {},
      stats: {},
      logs: [],
      markets: [],
      prices: {},
      config: {},
    };

    const topStatsEl = document.getElementById('topStats');
    const configPanelEl = document.getElementById('configPanel');
    const sectionsEl = document.getElementById('sections');
    const connectionEl = document.getElementById('connection');
    const runtimeLabelEl = document.getElementById('runtimeLabel');
    const modeLabelEl = document.getElementById('modeLabel');
    const dirty = new Set(['chrome', 'topStats', 'config', 'markets', 'logs']);
    let renderScheduled = false;
    let configMessageTimeout = null;
    const sectionCollapsed = {
      liveMarkets: false,
      settledMarkets: false,
    };

    function money(v, digits = 2) {
      const n = Number(v);
      return Number.isFinite(n) ? '$' + n.toFixed(digits) : '-';
    }

    function price(v) {
      const n = Number(v);
      return Number.isFinite(n) ? '$' + n.toFixed(4) : '-';
    }

    function probPct(v) {
      const n = Number(v);
      return Number.isFinite(n) ? (n * 100).toFixed(1) + '%' : '-';
    }

    function exactPrice(v) {
      const n = Number(v);
      if (!Number.isFinite(n)) return '-';
      return '$' + n.toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 8,
      });
    }

    function signedMoney(v, digits = 2) {
      const n = Number(v);
      if (!Number.isFinite(n)) return '-';
      const sign = n > 0 ? '+' : n < 0 ? '-' : '';
      return `${sign}$${Math.abs(n).toFixed(digits)}`;
    }

    function ts(v) {
      if (!v) return '-';
      const d = new Date(v);
      return Number.isNaN(d.getTime()) ? String(v) : d.toLocaleString();
    }

    function ago(v) {
      if (!v) return '-';
      const ms = Date.now() - Number(v);
      if (!Number.isFinite(ms)) return '-';
      if (ms < 1000) return 'just now';
      const sec = Math.floor(ms / 1000);
      if (sec < 60) return `${sec}s ago`;
      const min = Math.floor(sec / 60);
      if (min < 60) return `${min}m ago`;
      const hr = Math.floor(min / 60);
      return `${hr}h ago`;
    }

    function countdown(targetMs) {
      if (!targetMs) return '-';
      const ms = Number(targetMs) - Date.now();
      if (!Number.isFinite(ms)) return '-';
      if (ms <= 0) return 'settling now';
      const total = Math.floor(ms / 1000);
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      return h > 0 ? `${h}h ${String(m).padStart(2, '0')}m ${String(s).padStart(2, '0')}s` : `${m}m ${String(s).padStart(2, '0')}s`;
    }

    function chipClass(value) {
      const text = String(value || '').toLowerCase();
      if (text.includes('settled')) return 'settled';
      if (text.includes('buy') || text.includes('live') || text.includes('monitor')) return 'live';
      if (text.includes('resolv')) return 'waiting';
      if (text.includes('wait') || text.includes('discover') || text.includes('watch')) return 'waiting';
      if (text.includes('error') || text.includes('fail')) return 'error';
      return 'waiting';
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function activeBeatSymbols() {
      const raw = Array.isArray(state.config?.BEAT_SYMBOLS) && state.config.BEAT_SYMBOLS.length
        ? state.config.BEAT_SYMBOLS
        : (Array.isArray(state.runtime?.marketSymbols) && state.runtime.marketSymbols.length ? state.runtime.marketSymbols : ['BTC']);
      return raw
        .map((sym) => String(sym ?? '').trim().toUpperCase())
        .filter((sym) => sym !== '');
    }

    function priceEntriesFor(symbol) {
      const sources = state.prices?.[String(symbol ?? 'BTC').toUpperCase()] ?? {};
      return Object.entries(sources)
        .map(([source, data]) => ({
          source,
          symbol: String(symbol ?? 'BTC').toUpperCase(),
          price: data?.price != null && Number.isFinite(Number(data.price)) ? Number(data.price) : null,
          bestBid: data?.bestBid != null && Number.isFinite(Number(data.bestBid)) ? Number(data.bestBid) : null,
          bestAsk: data?.bestAsk != null && Number.isFinite(Number(data.bestAsk)) ? Number(data.bestAsk) : null,
          updatedAt: data?.updatedAt != null && Number.isFinite(Number(data.updatedAt)) ? Number(data.updatedAt) : null,
          isoTime: data?.isoTime || null,
        }))
        .sort((a, b) => {
          const tsDiff = Number(b.updatedAt ?? 0) - Number(a.updatedAt ?? 0);
          if (tsDiff !== 0) return tsDiff;
          return String(a.source).localeCompare(String(b.source));
        });
    }

    function bestPriceSnapshotFor(symbol) {
      const entries = priceEntriesFor(symbol);
      return entries.length ? entries[0] : null;
    }

    function beatSymbol(market) {
      if (market?.marketSymbol) return String(market.marketSymbol).toUpperCase();
      if (Array.isArray(state.runtime?.marketSymbols) && state.runtime.marketSymbols.length) {
        return String(state.runtime.marketSymbols[0]).toUpperCase();
      }
      return String(state.config?.BEAT_SYMBOLS?.[0] ?? 'BTC').toUpperCase();
    }

    function getWindowOpenMs(market) {
      const openMs = Number(market?.windowOpenAt ?? (market?.windowTs ? market.windowTs * 1000 : null));
      return Number.isFinite(openMs) ? openMs : null;
    }

    function secondsAfterMarketOpen(buy, market) {
      if (!buy?.recordedAt) return '-';
      const openMs = getWindowOpenMs(market);
      if (!openMs) return ago(buy.recordedAt);
      const sec = Math.max(0, Math.round((Number(buy.recordedAt) - openMs) / 1000));
      return `${sec}s`;
    }

    function secondsAfterMarketOpenRaw(entry, market) {
      const eventMs = Number(entry?.recordedAt ?? entry?.pairedAt ?? NaN);
      const openMs = getWindowOpenMs(market);
      if (!Number.isFinite(eventMs) || !Number.isFinite(openMs)) return Number.NaN;
      return (eventMs - openMs) / 1000;
    }

    function getWindowCloseMs(market) {
      const closeMs = Number(market?.windowCloseAt ?? null);
      return Number.isFinite(closeMs) ? closeMs : null;
    }

    const LIFECYCLE_ORDER = {
      upcoming: 0,
      'waiting for skip': 1,
      monitoring: 2,
      resolving: 3,
      halted: 4,
      settled: 5,
    };

    function marketLifecycle(market) {
      return String(market?.lifecycle ?? '').trim().toLowerCase();
    }

    function marketStatusText(market) {
      return marketLifecycle(market);
    }

    function marketRank(market) {
      return LIFECYCLE_ORDER[marketLifecycle(market)] ?? -1;
    }

    function isSettledMarket(market) {
      return marketLifecycle(market) === 'settled';
    }

    function sortMarketsForView(markets) {
      return [...markets].sort((a, b) => {
        const stageDiff = marketRank(a) - marketRank(b);
        if (stageDiff !== 0) return stageDiff;
        const aTs = Number(a?.windowTs ?? 0);
        const bTs = Number(b?.windowTs ?? 0);
        return aTs - bTs;
      });
    }

    function outcomeLabel(market) {
      if (market.outcome) return market.outcome;
      if (market.settled) return 'unknown';
      return '-';
    }

    function tradePairMap(market) {
      const buyEvents = Array.isArray(market.buyEvents) ? market.buyEvents : [];
      const pairEvents = Array.isArray(market.pairEvents) ? market.pairEvents : [];
      const map = new Map();
      for (const buy of buyEvents) {
        const id = String(buy?.id ?? '').trim();
        if (!id) continue;
        map.set(id, { id, pairIds: [], pairedShares: 0, originalShares: Number(buy?.shares ?? 0) });
      }
      for (const pair of pairEvents) {
        const pairId = String(pair?.id ?? '').trim();
        const shares = Number(pair?.shares ?? 0);
        // 한 페어가 여러 로트를 소비할 수 있으므로 소비한 모든 로트를 연결한다.
        // 신규 포맷(upLotShares/downLotShares: [{id,shares}])을 우선 사용하고,
        // 없으면 구 포맷(upLotIds/downLotIds 배열 또는 upLotId/downLotId 단일)으로 폴백.
        const perLot = [
          ...(Array.isArray(pair?.upLotShares) ? pair.upLotShares : []),
          ...(Array.isArray(pair?.downLotShares) ? pair.downLotShares : []),
        ].filter((entry) => entry && String(entry.id ?? '').trim());

        if (perLot.length) {
          for (const { id: rawId, shares: lotShares } of perLot) {
            const id = String(rawId).trim();
            if (!map.has(id)) {
              map.set(id, { id, pairIds: [], pairedShares: 0, originalShares: 0 });
            }
            const entry = map.get(id);
            if (!entry.pairIds.includes(pairId)) entry.pairIds.push(pairId);
            entry.pairedShares += Number.isFinite(Number(lotShares)) ? Number(lotShares) : 0;
          }
          continue;
        }

        const idList = [
          ...(Array.isArray(pair?.upLotIds) ? pair.upLotIds : [pair?.upLotId]),
          ...(Array.isArray(pair?.downLotIds) ? pair.downLotIds : [pair?.downLotId]),
        ].map((value) => String(value ?? '').trim()).filter(Boolean);
        for (const id of idList) {
          if (!map.has(id)) {
            map.set(id, { id, pairIds: [], pairedShares: 0, originalShares: 0 });
          }
          const entry = map.get(id);
          if (!entry.pairIds.includes(pairId)) entry.pairIds.push(pairId);
          entry.pairedShares += Number.isFinite(shares) ? shares : 0;
        }
      }
      return map;
    }

    function tradeIntentClass(buy) {
      const intent = String(buy?.intent ?? '').toLowerCase();
      const reason = String(buy?.reasonTag ?? '').toLowerCase();
      if (intent === 'pair-buy' || reason === 'pair-completion') return 'pair';
      return 'directional';
    }

    function tradeIntentLabel(cls) {
      if (cls === 'pair') return 'Pair';
      return 'Directional Buy';
    }

    function tradeAnnotations(market) {
      const buyEvents = Array.isArray(market.buyEvents) ? market.buyEvents : [];
      return buyEvents.map((buy, index) => {
        const second = secondsAfterMarketOpenRaw(buy, market);
        if (!Number.isFinite(second)) return null;
        const id = String(buy?.id ?? `buy-${index + 1}`);
        return {
          second,
          label: `${id.replace(/^buy-/, 'T')} ${Math.round(second)}s`,
          intent: tradeIntentClass(buy),
        };
      }).filter(Boolean);
    }

    function tradeSummary(market) {
      if (!market.tradeOccurred && !market.buyShares) {
        return `<div class="empty">No trade executed on this market.</div>`;
      }
      const pnl = Number(market.pnl ?? 0);
      const title = market.settled ? 'Settlement summary' : 'Trade summary';
      const moveAtBuy = market.moveAtBuyUsd;
      const moveAtBuyPct = market.moveAtBuyPct;
      const buyEvents = Array.isArray(market.buyEvents) ? market.buyEvents : [];
      const pairEvents = Array.isArray(market.pairEvents) ? market.pairEvents : [];
      const buyRows = buyEvents.length
        ? buyEvents.map((buy, index) => {
            const buyMove = Number(buy?.moveAtBuyUsd ?? null);
            const buyMovePct = buy?.moveAtBuyPct;
            return `
              <div class="buy-item">
                <div class="head">
                  <span>Buy #${index + 1} ${buy?.side ? `(${buy.side})` : ''}</span>
                  <span>${money(buy?.usdc)}</span>
                </div>
                <div class="meta">
                  ${buy?.shares != null ? `${Number(buy.shares).toFixed(4)} shares` : '-'} at ${price(buy?.price)}
                  ${buyMovePct != null ? ` • move ${signedMoney(buyMove)} (${buyMovePct >= 0 ? '+' : ''}${Number(buyMovePct).toFixed(2)}%)` : ''}
                  ${buy?.recordedAt ? ` • ${secondsAfterMarketOpen(buy, market)}` : ''}
                </div>
              </div>
            `;
          }).join('')
        : '';
      const pairRows = pairEvents.length
        ? pairEvents.map((pair, index) => `
            <div class="buy-item">
              <div class="head">
                <span>Pair #${index + 1}</span>
                <span>${Number(pair?.shares ?? 0).toFixed(4)} shares</span>
              </div>
              <div class="meta">
                cost ${price(pair?.averagePairCost)} = Up ${price(pair?.upPrice)} + Down ${price(pair?.downPrice)}
              </div>
            </div>
          `).join('')
        : '';
      return `
        <div class="settlement">
          <div class="title">${title}</div>
          <div class="settlement-grid">
            <div class="summary-box">
              <div class="label">Outcome</div>
              <div class="value">${outcomeLabel(market)}</div>
            </div>
            <div class="summary-box">
              <div class="label">Market PnL</div>
              <div class="value ${pnl >= 0 ? 'summary-positive' : 'summary-negative'}">${money(pnl)}</div>
            </div>
            <div class="summary-box">
              <div class="label">Chosen Side</div>
              <div class="value">${market.chosenSide || '-'}</div>
            </div>
            <div class="summary-box">
              <div class="label">Buy Shares</div>
              <div class="value">${market.buyShares != null ? Number(market.buyShares).toFixed(4) : '-'}</div>
            </div>
            <div class="summary-box">
              <div class="label">Total Buy USDC</div>
              <div class="value">${money(market.buyUsdc)}</div>
            </div>
            <div class="summary-box">
              <div class="label">Buy Price</div>
              <div class="value">${price(market.buyPrice)}</div>
            </div>
            <div class="summary-box">
              <div class="label">Buy Count</div>
              <div class="value">${market.buyCount != null ? Number(market.buyCount) : '-'}</div>
            </div>
            <div class="summary-box">
              <div class="label">Paired Shares</div>
              <div class="value">${Number(market.pairedShares ?? 0).toFixed(4)}</div>
            </div>
            <div class="summary-box">
              <div class="label">Avg Pair Cost</div>
              <div class="value">${price(market.averagePairedCost)}</div>
            </div>
            <div class="summary-box">
              <div class="label">Unpaired Up</div>
              <div class="value">${Number(market.unpairedUpShares ?? 0).toFixed(4)}</div>
            </div>
            <div class="summary-box">
              <div class="label">Unpaired Down</div>
              <div class="value">${Number(market.unpairedDownShares ?? 0).toFixed(4)}</div>
            </div>
          </div>
        </div>
        ${buyRows ? `
          <div class="buy-history">
            <div class="title">Buy History</div>
            <div class="buy-list">${buyRows}</div>
          </div>
        ` : ''}
        ${pairRows ? `
          <div class="buy-history">
            <div class="title">Pair History</div>
            <div class="buy-list">${pairRows}</div>
          </div>
        ` : ''}
      `;
    }

    function renderConfig() {
      const configJson = JSON.stringify(state.config ?? {}, null, 2);
      return `
        <div class="panel-head">
          <div>
            <h2 class="panel-title">Runtime Config</h2>
            <div class="panel-subtitle">Edit beat settings live. Some startup-only values still require a restart, but the active strategy reads this object directly.</div>
          </div>
          <div class="status-chip live">Editable</div>
        </div>
        <div class="panel-body">
          <div class="config-toolbar">
            <div class="config-note">Changes are applied immediately to the running beat loop when possible.</div>
            <div class="config-actions">
              <button class="config-button secondary" type="button" data-config-action="reload">Reload</button>
              <button class="config-button" type="button" data-config-action="apply">Apply</button>
            </div>
          </div>
          <textarea class="config-editor" id="configEditor" spellcheck="false">${escapeHtml(configJson)}</textarea>
          <div class="config-status" id="configStatus"></div>
        </div>
      `;
    }

    function renderTop() {
      const markets = Array.isArray(state.markets) ? state.markets : [];
      const live = sortMarketsForView(markets.filter((m) => !isSettledMarket(m)));
      const settledMarkets = Number(state.stats?.settledMarkets ?? 0);
      const tradedMarkets = Number(state.stats?.tradedMarkets ?? 0);
      const realizedPnl = Number(state.stats?.realizedPnl ?? 0);
      const symbols = activeBeatSymbols();
      
      const priceStats = symbols.map((symbol) => {
        const sourceList = priceEntriesFor(symbol);
        
        return {
          label: `${symbol} Prices (${sourceList.length} source${sourceList.length !== 1 ? 's' : ''})`,
          html: sourceList.length > 0 ? `
            <table class="price-table">
              <thead>
                <tr>
                  <th>Source</th>
                  <th>Price</th>
                  <th>Bid / Ask</th>
                  <th>Timestamp</th>
                </tr>
              </thead>
              <tbody>
                ${sourceList.map(({ source, price: sourcePrice, bestBid, bestAsk, updatedAt }) => `
                  <tr>
                    <td>${escapeHtml(source)}</td>
                    <td>${exactPrice(sourcePrice)}</td>
                    <td>${price(bestBid)} / ${price(bestAsk)}</td>
                    <td>${updatedAt ? `${ts(updatedAt)}<br><span style="color:var(--muted);font-size:0.78rem;">${ago(updatedAt)}</span>` : '-'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          ` : 'No prices',
          isTable: true,
        };
      });
      
      const stats = [
        ...priceStats,
        { label: 'Live Markets', value: String(live.length), hint: state.runtime.mode ? `Mode: ${state.runtime.mode}` : '' },
        { label: 'Settled Markets', value: String(settledMarkets), hint: state.runtime.mode ? `Mode: ${state.runtime.mode}` : '' },
        { label: 'Traded Markets', value: String(tradedMarkets), hint: state.runtime.mode ? `Mode: ${state.runtime.mode}` : '' },
        { label: 'Realized PnL', value: money(realizedPnl), hint: state.runtime.mode ? `Mode: ${state.runtime.mode}` : '' },
      ];

      topStatsEl.innerHTML = stats.map(({ label, value, hint, html, isTable }) => {
        if (isTable) {
          return `<article class="stat" style="grid-column:1/-1;"><div class="label">${label}</div><div style="overflow-x:auto;">${html}</div></article>`;
        }
        return `<article class="stat"><div class="label">${label}</div><div class="value">${value}</div><div class="hint">${hint}</div></article>`;
      }).join('');
    }

    function seriesPoints(market, key) {
      const points = Array.isArray(market?.chartHistory?.[key]) ? market.chartHistory[key] : [];
      return points
        .map((entry) => {
          const second = typeof entry?.second === 'number' ? entry.second : Number.NaN;
          const value = entry?.value == null
            ? null
            : (typeof entry?.value === 'number' ? entry.value : Number.NaN);
          return { second, value };
        })
        .filter((entry) => Number.isFinite(entry.second) && entry.second >= 0 && entry.second <= 300)
        .sort((a, b) => a.second - b.second);
    }

    function linePath(points, centerValue, radius, width, height, paddingX, paddingY) {
      if (!points.length || !Number.isFinite(radius) || radius <= 0) return '';
      const usableWidth = width - (paddingX * 2);
      const usableHeight = height - (paddingY * 2);
      let drawing = false;
      return points.map((point) => {
        if (!Number.isFinite(point.value)) {
          drawing = false;
          return '';
        }
        const x = paddingX + (Math.max(0, Math.min(300, point.second)) / 300) * usableWidth;
        const normalized = (point.value - centerValue) / radius;
        const clamped = Math.max(-1, Math.min(1, normalized));
        const y = paddingY + ((1 - ((clamped + 1) / 2)) * usableHeight);
        const command = drawing ? 'L' : 'M';
        drawing = true;
        return `${command} ${x.toFixed(2)} ${y.toFixed(2)}`;
      }).filter(Boolean).join(' ');
    }

    function chartSvg(seriesList, { centerValue, minRadius = 0.01, fixedRadius = null, yFormatter }) {
      const width = 520;
      const height = 228;
      const paddingX = 34;
      const paddingY = 20;
      const allValues = seriesList.flatMap((series) =>
        series.points
          .map((point) => point.value)
          .filter((value) => Number.isFinite(value)),
      );
      if (!allValues.length) {
        return `<div class="graph-empty">Waiting for monitoring samples...</div>`;
      }

      const radius = Number.isFinite(Number(fixedRadius)) && Number(fixedRadius) > 0
        ? Number(fixedRadius)
        : Math.max(
          minRadius,
          ...allValues.map((value) => Math.abs(value - centerValue)),
        );
      const centerY = paddingY + ((height - (paddingY * 2)) / 2);
      const bottomY = height - paddingY;
      const rightX = width - paddingX;
      const pathHtml = seriesList
        .map((series) => {
          const path = linePath(series.points, centerValue, radius, width, height, paddingX, paddingY);
          return path ? `<path class="${series.className}" d="${path}"></path>` : '';
        })
        .join('');

      return `
        <svg class="graph-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true">
          <line class="graph-track" x1="${paddingX}" y1="${paddingY}" x2="${paddingX}" y2="${bottomY}"></line>
          <line class="graph-track" x1="${paddingX}" y1="${bottomY}" x2="${rightX}" y2="${bottomY}"></line>
          <line class="graph-axis-line center" x1="${paddingX}" y1="${centerY}" x2="${rightX}" y2="${centerY}"></line>
          <line class="graph-axis-line" x1="${paddingX}" y1="${paddingY}" x2="${rightX}" y2="${paddingY}"></line>
          ${pathHtml}
          <text class="graph-axis-label" x="${paddingX}" y="${height - 2}" text-anchor="start">0s</text>
          <text class="graph-axis-label" x="${rightX}" y="${height - 2}" text-anchor="end">300s</text>
          <text class="graph-axis-label" x="${paddingX - 6}" y="${paddingY + 4}" text-anchor="end">${escapeHtml(yFormatter(centerValue + radius))}</text>
          <text class="graph-axis-label" x="${paddingX - 6}" y="${centerY + 4}" text-anchor="end">${escapeHtml(yFormatter(centerValue))}</text>
          <text class="graph-axis-label" x="${paddingX - 6}" y="${bottomY + 4}" text-anchor="end">${escapeHtml(yFormatter(centerValue - radius))}</text>
        </svg>
      `;
    }

    function annotatedChartSvg(seriesList, { centerValue, minRadius = 0.01, fixedRadius = null, yFormatter, annotations = [] }) {
      const width = 520;
      const height = 228;
      const paddingX = 34;
      const paddingY = 20;
      const allValues = seriesList.flatMap((series) =>
        series.points
          .map((point) => point.value)
          .filter((value) => Number.isFinite(value)),
      );
      if (!allValues.length) {
        return `<div class="graph-empty">Waiting for monitoring samples...</div>`;
      }

      const radius = Number.isFinite(Number(fixedRadius)) && Number(fixedRadius) > 0
        ? Number(fixedRadius)
        : Math.max(
          minRadius,
          ...allValues.map((value) => Math.abs(value - centerValue)),
        );
      const centerY = paddingY + ((height - (paddingY * 2)) / 2);
      const bottomY = height - paddingY;
      const rightX = width - paddingX;
      const usableWidth = width - (paddingX * 2);
      const pathHtml = seriesList
        .map((series) => {
          const path = linePath(series.points, centerValue, radius, width, height, paddingX, paddingY);
          return path ? `<path class="${series.className}" d="${path}"></path>` : '';
        })
        .join('');
      const annotationHtml = annotations
        .filter((annotation) => Number.isFinite(Number(annotation?.second)))
        .map((annotation, index) => {
          const second = Math.max(0, Math.min(300, Number(annotation.second)));
          const x = paddingX + (second / 300) * usableWidth;
          const lineClass = `graph-trade-line-${annotation.intent}`;
          const badgeClass = `graph-trade-badge-${annotation.intent}`;
          const y = paddingY + 4 + ((index % 4) * 14);
          const label = escapeHtml(annotation.label ?? `${Math.round(second)}s`);
          const badgeWidth = Math.max(34, (String(annotation.label ?? '').length * 5.9) + 8);
          return `
            <line class="${lineClass}" x1="${x.toFixed(2)}" y1="${paddingY}" x2="${x.toFixed(2)}" y2="${bottomY}"></line>
            <rect class="${badgeClass}" x="${(x - (badgeWidth / 2)).toFixed(2)}" y="${(y - 9).toFixed(2)}" rx="5" ry="5" width="${badgeWidth.toFixed(2)}" height="12"></rect>
            <text class="graph-trade-label" x="${x.toFixed(2)}" y="${y.toFixed(2)}" text-anchor="middle">${label}</text>
          `;
        })
        .join('');

      return `
        <svg class="graph-svg" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none" aria-hidden="true">
          <line class="graph-track" x1="${paddingX}" y1="${paddingY}" x2="${paddingX}" y2="${bottomY}"></line>
          <line class="graph-track" x1="${paddingX}" y1="${bottomY}" x2="${rightX}" y2="${bottomY}"></line>
          <line class="graph-axis-line center" x1="${paddingX}" y1="${centerY}" x2="${rightX}" y2="${centerY}"></line>
          <line class="graph-axis-line" x1="${paddingX}" y1="${paddingY}" x2="${rightX}" y2="${paddingY}"></line>
          ${pathHtml}
          ${annotationHtml}
          <text class="graph-axis-label" x="${paddingX}" y="${height - 2}" text-anchor="start">0s</text>
          <text class="graph-axis-label" x="${rightX}" y="${height - 2}" text-anchor="end">300s</text>
          <text class="graph-axis-label" x="${paddingX - 6}" y="${paddingY + 4}" text-anchor="end">${escapeHtml(yFormatter(centerValue + radius))}</text>
          <text class="graph-axis-label" x="${paddingX - 6}" y="${centerY + 4}" text-anchor="end">${escapeHtml(yFormatter(centerValue))}</text>
          <text class="graph-axis-label" x="${paddingX - 6}" y="${bottomY + 4}" text-anchor="end">${escapeHtml(yFormatter(centerValue - radius))}</text>
        </svg>
      `;
    }

    function tradeSummaryRich(market) {
      if (!market.tradeOccurred && !market.buyShares) {
        return `<div class="empty">No trade executed on this market.</div>`;
      }
      const pnl = Number(market.pnl ?? 0);
      const title = market.settled ? 'Settlement summary' : 'Trade summary';
      const buyEvents = Array.isArray(market.buyEvents) ? market.buyEvents : [];
      const pairEvents = Array.isArray(market.pairEvents) ? market.pairEvents : [];
      const pairMap = tradePairMap(market);
      // 페어 ID → 사용된 arb pair cost(=Up가+Down가) 룩업.
      const pairCostById = new Map();
      for (const pair of pairEvents) {
        const pid = String(pair?.id ?? '').trim();
        if (pid) pairCostById.set(pid, Number(pair?.averagePairCost));
      }
      const buyRows = buyEvents.length
        ? buyEvents.map((buy, index) => {
          const buyMove = Number(buy?.moveAtBuyUsd ?? null);
          const buyMovePct = buy?.moveAtBuyPct;
          const buyId = String(buy?.id ?? `buy-${index + 1}`);
          const mapping = pairMap.get(buyId);
          const pairIds = Array.isArray(mapping?.pairIds) ? mapping.pairIds : [];
          const paired = pairIds.length > 0;
          const tradeIntent = tradeIntentClass(buy);
          // arb pair cost 표시(directional 매수에만):
          //   미페어 → 지금 페어한다면 드는 비용(live) = 이 매수가 + 현재 반대편 ask
          //   페어됨 → 실제로 사용된 페어 비용(used) = 속한 pair 의 averagePairCost
          let arbPairCostChip = '';
          if (tradeIntent === 'directional') {
            if (paired) {
              const usedCosts = pairIds
                .map((pid) => pairCostById.get(pid))
                .filter((c) => Number.isFinite(c));
              if (usedCosts.length) {
                const usedLabel = [...new Set(usedCosts.map((c) => price(c)))].join(', ');
                arbPairCostChip = `<span class="trade-chip">Used pair cost: ${usedLabel}</span>`;
              }
            } else {
              const oppAsk = buy?.side === 'Up'
                ? Number(market.downBestAsk)
                : (buy?.side === 'Down' ? Number(market.upBestAsk) : NaN);
              const buyPrice = Number(buy?.price);
              const livePairCost = (Number.isFinite(buyPrice) && Number.isFinite(oppAsk))
                ? buyPrice + oppAsk
                : null;
              arbPairCostChip = `<span class="trade-chip">Live pair cost: ${livePairCost != null ? price(livePairCost) : '-'}</span>`;
            }
          }
          return `
            <div class="buy-item ${paired ? 'paired' : 'unpaired'}">
              <div class="head">
                <span>${escapeHtml(buyId)} ${buy?.side ? `(${buy.side})` : ''}</span>
                <span>${money(buy?.usdc)}</span>
              </div>
              <div class="trade-chip-row">
                <span class="trade-chip ${tradeIntent}">${tradeIntentLabel(tradeIntent)}</span>
                <span class="trade-chip ${paired ? 'good' : 'warn'}">${paired ? 'Paired' : 'Unpaired'}</span>
                ${arbPairCostChip}
                ${paired ? `<span class="trade-chip good">Pair IDs: ${escapeHtml(pairIds.join(', '))}</span>` : ''}
              </div>
              <div class="meta">
                ${buy?.shares != null ? `${Number(buy.shares).toFixed(4)} shares` : '-'} at ${price(buy?.price)}
                ${Number.isFinite(Number(buy?.feeUsdc)) ? ` • fee ${money(buy.feeUsdc)}` : ''}
                ${buyMovePct != null ? ` • move ${signedMoney(buyMove)} (${buyMovePct >= 0 ? '+' : ''}${Number(buyMovePct).toFixed(2)}%)` : ''}
                ${buy?.recordedAt ? ` • ${secondsAfterMarketOpen(buy, market)}` : ''}
              </div>
            </div>
          `;
        }).join('')
        : '';
      const pairRows = pairEvents.length
        ? pairEvents.map((pair, index) => `
          <div class="buy-item paired">
            <div class="head">
              <span>${escapeHtml(String(pair?.id ?? `pair-${index + 1}`))}</span>
              <span>${Number(pair?.shares ?? 0).toFixed(4)} shares</span>
            </div>
            <div class="trade-chip-row">
              <span class="trade-chip pair">Pair</span>
              <span class="trade-chip good">${escapeHtml(String(pair?.upLotId ?? '-'))} / ${escapeHtml(String(pair?.downLotId ?? '-'))}</span>
            </div>
            <div class="meta">
              cost ${price(pair?.averagePairCost)} = Up ${price(pair?.upPrice)} + Down ${price(pair?.downPrice)}
              ${pair?.pairedAt ? ` • ${secondsAfterMarketOpen({ pairedAt: pair.pairedAt }, market)}` : ''}
            </div>
          </div>
        `).join('')
        : '';
      return `
        <div class="settlement">
          <div class="title">${title}</div>
          <div class="settlement-grid">
            <div class="summary-box"><div class="label">Outcome</div><div class="value">${outcomeLabel(market)}</div></div>
            <div class="summary-box"><div class="label">Market PnL</div><div class="value ${pnl >= 0 ? 'summary-positive' : 'summary-negative'}">${money(pnl)}</div></div>
            <div class="summary-box"><div class="label">Chosen Side</div><div class="value">${market.chosenSide || '-'}</div></div>
            <div class="summary-box"><div class="label">Buy Shares</div><div class="value">${market.buyShares != null ? Number(market.buyShares).toFixed(4) : '-'}</div></div>
            <div class="summary-box"><div class="label">Total Buy USDC</div><div class="value">${money(market.buyUsdc)}</div></div>
            <div class="summary-box"><div class="label">Fees Paid</div><div class="value">${money(market.totalFeesUsdc ?? market.buyFeesUsdc)}</div></div>
            <div class="summary-box"><div class="label">Buy Price</div><div class="value">${price(market.buyPrice)}</div></div>
            <div class="summary-box"><div class="label">Buy Count</div><div class="value">${market.buyCount != null ? Number(market.buyCount) : '-'}</div></div>
            <div class="summary-box"><div class="label">Paired Shares</div><div class="value">${Number(market.pairedShares ?? 0).toFixed(4)}</div></div>
            <div class="summary-box"><div class="label">Avg Pair Cost</div><div class="value">${price(market.averagePairedCost)}</div></div>
            <div class="summary-box"><div class="label">Unpaired Up</div><div class="value">${Number(market.unpairedUpShares ?? 0).toFixed(4)}</div></div>
            <div class="summary-box"><div class="label">Unpaired Down</div><div class="value">${Number(market.unpairedDownShares ?? 0).toFixed(4)}</div></div>
          </div>
        </div>
        ${buyRows ? `<div class="buy-history"><div class="title">Buy History</div><div class="buy-list">${buyRows}</div></div>` : ''}
        ${pairRows ? `<div class="buy-history"><div class="title">Pair History</div><div class="buy-list">${pairRows}</div></div>` : ''}
      `;
    }

    function renderMonitoringGraphs(market, symbol, move) {
      const movePoints = seriesPoints(market, 'move');
      const upAskPoints = seriesPoints(market, 'upAsk');
      const downAskPoints = seriesPoints(market, 'downAsk');
      const annotations = tradeAnnotations(market);
      const moveChart = annotatedChartSvg(
        [{ points: movePoints, className: 'graph-line-move' }],
        {
          centerValue: 0,
          minRadius: 10,
          yFormatter: (value) => signedMoney(value, 0),
          annotations,
        },
      );
      const askChart = annotatedChartSvg(
        [
          { points: upAskPoints, className: 'graph-line-up' },
          { points: downAskPoints, className: 'graph-line-down' },
        ],
        {
          centerValue: 0.5,
          fixedRadius: 0.5,
          yFormatter: (value) => price(value),
          annotations,
        },
      );

      return `
        <aside class="market-graphs">
          <section class="graph-card">
            <div class="graph-head">
              <div class="graph-title">${symbol} Move</div>
              <div class="graph-meta">0 is middle line</div>
            </div>
            <div class="graph-legend">
              <span class="legend-item"><span class="legend-swatch" style="background:#0f766e;"></span>Now ${signedMoney(move)}</span>
              <span class="legend-item"><span class="legend-swatch" style="background:rgba(15,118,110,0.55);"></span>Directional buy</span>
              <span class="legend-item"><span class="legend-swatch" style="background:rgba(180,35,24,0.55);"></span>Pair</span>
            </div>
            <div class="graph-shell">${moveChart}</div>
          </section>
          <section class="graph-card">
            <div class="graph-head">
              <div class="graph-title">Up Ask / Down Ask</div>
              <div class="graph-meta">0.5 is middle line</div>
            </div>
            <div class="graph-legend">
              <span class="legend-item"><span class="legend-swatch" style="background:#166534;"></span>Up Ask ${price(market.upBestAsk)}</span>
              <span class="legend-item"><span class="legend-swatch" style="background:#b42318;"></span>Down Ask ${price(market.downBestAsk)}</span>
              <span class="legend-item">P(Up) ${probPct(market.fairProbUp)}</span>
              <span class="legend-item">P(Down) ${probPct(market.fairProbDown)}</span>
              <span class="legend-item"><span class="legend-swatch" style="background:rgba(15,118,110,0.55);"></span>Directional buy</span>
              <span class="legend-item"><span class="legend-swatch" style="background:rgba(180,35,24,0.55);"></span>Pair</span>
            </div>
            <div class="graph-shell">${askChart}</div>
          </section>
        </aside>
      `;
    }

    function renderMonitoringGraphsPanel(markets) {
      const nowMs = Date.now();
      const monitoring = sortMarketsForView(
        markets.filter((market) => {
          const openMs = getWindowOpenMs(market);
          const closeMs = getWindowCloseMs(market);
          return Number.isFinite(openMs) && Number.isFinite(closeMs) && nowMs >= openMs && nowMs < closeMs;
        }),
      );

      if (!monitoring.length) {
        return `
          <section class="panel monitoring-graphs-panel">
            <div class="panel-head">
            <div>
              <h2 class="panel-title">Monitoring Graphs</h2>
              <div class="panel-subtitle">Live move and ask history for markets whose window has not ended yet.</div>
            </div>
            <span class="status-chip waiting">0 live</span>
            </div>
            <div class="panel-body">
              <div class="empty">Graphs appear here when a market enters monitoring.</div>
            </div>
          </section>
        `;
      }

      const graphHtml = monitoring.map((market) => {
        const symbol = beatSymbol(market);
        const latestSnapshot = bestPriceSnapshotFor(symbol);
        const symbolPrice = latestSnapshot?.price ?? null;
        const beat = market.beatPrice ?? symbolPrice;
        const livePrice = market.btcPrice ?? symbolPrice;
        const move = Number.isFinite(Number(livePrice)) && Number.isFinite(Number(beat))
          ? Number(livePrice) - Number(beat)
          : null;

        return `
          <article class="graph-card" style="padding:16px;">
            <div class="graph-head">
              <div>
                <div class="graph-title">${escapeHtml(market.slug || '?')}</div>
                <div class="graph-meta">${escapeHtml(symbol)} ${escapeHtml(marketStatusText(market) || 'live')}</div>
              </div>
              <span class="status-chip ${chipClass(marketStatusText(market))}">${escapeHtml(marketStatusText(market) || 'live')}</span>
            </div>
            ${renderMonitoringGraphs(market, symbol, move)}
          </article>
        `;
      }).join('');

      return `
        <section class="panel monitoring-graphs-panel">
          <div class="panel-head">
            <div>
              <h2 class="panel-title">Monitoring Graphs</h2>
              <div class="panel-subtitle">Move and ask history for markets before their end time, shown beside the live markets list.</div>
            </div>
            <span class="status-chip live">${monitoring.length} live</span>
          </div>
          <div class="panel-body">
            <div class="market-graphs">${graphHtml}</div>
          </div>
        </section>
      `;
    }

    function renderMarketCard(market) {
      const lifecycle = marketLifecycle(market);
      const settled = lifecycle === 'settled';
      const preOpen = lifecycle === 'upcoming';
      const statusText = marketStatusText(market);
      const symbol = beatSymbol(market);
      const latestSnapshot = bestPriceSnapshotFor(symbol);
      const traded = Boolean(market.tradeOccurred || Number(market.buyShares || 0) > 0);
      const symbolPrice = latestSnapshot?.price ?? null;
      const beat = market.beatPrice ?? symbolPrice;
      const livePrice = market.btcPrice ?? symbolPrice;
      const move = !settled && Number.isFinite(Number(livePrice)) && Number.isFinite(Number(beat))
        ? Number(livePrice) - Number(beat)
        : null;
      const movePct = !settled && Number.isFinite(move) && Number.isFinite(Number(beat)) && Number(beat) !== 0
        ? (move / Number(beat)) * 100
        : null;
      const buyEvents = Array.isArray(market.buyEvents) ? market.buyEvents : [];
      const totalBuyUsdc = buyEvents.reduce((sum, buy) => sum + Number(buy?.usdc ?? 0), 0);
      const pairedShares = Number(market.pairedShares ?? 0);
      const unpairedUpShares = Number(market.unpairedUpShares ?? 0);
      const unpairedDownShares = Number(market.unpairedDownShares ?? 0);
      const pnlIfUp = traded && !settled ? (pairedShares + unpairedUpShares - totalBuyUsdc) : null;
      const pnlIfDown = traded && !settled ? (pairedShares + unpairedDownShares - totalBuyUsdc) : null;
      const moveLabel = settled ? null : `${symbol} Move`;
      const moveValueText = settled
        ? null
        : `${signedMoney(move)}${movePct != null ? ` (${movePct >= 0 ? '+' : ''}${movePct.toFixed(2)}%)` : ''}`;
      const moveValueClass = settled
        ? ''
        : (Number(move) >= 0 ? 'summary-positive' : 'summary-negative');
      return `
        <article class="market-card ${settled ? 'settled' : ''}">
          <div class="market-head">
            <div class="market-name">
              <div class="eyebrow">${settled ? 'Settled market' : (preOpen ? 'Upcoming market' : (lifecycle === 'resolving' ? 'Resolving market' : 'Live market'))}</div>
              <div class="slug-row">
                <h3>${escapeHtml(market.slug || '?')}</h3>
                ${market.slug ? `<button class="copy-slug-btn" type="button" data-copy-slug="${escapeHtml(market.slug)}" title="Copy slug">Copy</button>` : ''}
              </div>
            </div>
            <span class="status-chip ${chipClass(statusText)}">${statusText}</span>
          </div>
          <div class="market-meta">
            <span>${settled ? `Settled ${ts(market.settledAt)}` : (preOpen ? `Opens in ${countdown(market.windowOpenAt)}` : (lifecycle === 'waiting for skip' ? 'Waiting for skip' : (lifecycle === 'resolving' ? `Resolving ${countdown(market.windowCloseAt)}` : `Settles in ${countdown(market.windowCloseAt)}`)))}</span>
            <span>Updated ${ago(market.updatedAt)}</span>
            <span>Window open ${ts(getWindowOpenMs(market))}</span>
          </div>
          <div class="metric-grid">
            <div class="metric"><div class="label">Beat ${symbol}</div><div class="value">${money(beat)}</div></div>
            ${!settled ? `<div class="metric"><div class="label">${moveLabel}</div><div class="value ${moveValueClass}">${moveValueText}</div></div>` : ''}
            ${traded && !settled ? `<div class="metric"><div class="label">Simulated If Up</div><div class="value ${pnlIfUp >= 0 ? 'summary-positive' : 'summary-negative'}">${money(pnlIfUp)}</div></div><div class="metric"><div class="label">Simulated If Down</div><div class="value ${pnlIfDown >= 0 ? 'summary-positive' : 'summary-negative'}">${money(pnlIfDown)}</div></div>` : ''}
            <div class="metric"><div class="label">Up Bid</div><div class="value">${price(market.upBestBid)}</div></div>
            <div class="metric"><div class="label">Up Ask</div><div class="value">${price(market.upBestAsk)}</div><div class="subvalue">P(Up) ${probPct(market.fairProbUp)}</div></div>
            <div class="metric"><div class="label">Down Bid</div><div class="value">${price(market.downBestBid)}</div></div>
            <div class="metric"><div class="label">Down Ask</div><div class="value">${price(market.downBestAsk)}</div><div class="subvalue">P(Down) ${probPct(market.fairProbDown)}</div></div>
            <div class="metric"><div class="label">Trade Status</div><div class="value small">${statusText}</div></div>
            <div class="metric"><div class="label">Settlement</div><div class="value small">${settled ? (market.outcome || '-') : (preOpen ? '' : countdown(market.windowCloseAt))}</div></div>
          </div>
          ${traded ? tradeSummaryRich(market) : ''}
        </article>
      `;
    }

    function renderMarkets() {
      const markets = Array.isArray(state.markets) ? state.markets : [];
      const live = sortMarketsForView(markets.filter((m) => !isSettledMarket(m)));
      const settled = [...markets.filter((m) => isSettledMarket(m) && (m.tradeOccurred || Number(m.buyShares || 0) > 0))]
        .sort((a, b) => Number(b?.windowTs ?? 0) - Number(a?.windowTs ?? 0));

      const liveHtml = live.length
        ? live.map(renderMarketCard).join('')
        : `<div class="empty">No active market is being tracked right now.</div>`;
      const settledHtml = settled.length
        ? settled.map(renderMarketCard).join('')
        : `<div class="empty">No settled markets yet.</div>`;

      return `
        <div class="live-section-layout">
          <div class="sections-main">
            <section class="panel">
              <div class="panel-head">
                <div>
                  <h2 class="panel-title">Live Markets</h2>
                  <div class="panel-subtitle">Open and pre-open up/down windows, with upcoming markets shown inline.</div>
                </div>
                <div>
                  <button class="panel-toggle" type="button" data-panel-toggle="liveMarkets">${sectionCollapsed.liveMarkets ? 'Expand' : 'Collapse'}</button>
                  <span class="status-chip live">${live.length} active</span>
                </div>
              </div>
              <div class="panel-body ${sectionCollapsed.liveMarkets ? 'is-collapsed' : ''}">
                <div class="market-column">${liveHtml}</div>
              </div>
            </section>
          </div>
          <aside class="sections-side">
            ${renderMonitoringGraphsPanel(live)}
          </aside>
        </div>
        <div class="sections-main centered-stack">
          <section class="panel">
            <div class="panel-head">
              <div>
                <h2 class="panel-title">Settled Markets</h2>
                <div class="panel-subtitle">Outcome, PnL, and trade details for completed markets that actually traded.</div>
              </div>
              <div>
                <button class="panel-toggle" type="button" data-panel-toggle="settledMarkets">${sectionCollapsed.settledMarkets ? 'Expand' : 'Collapse'}</button>
                <span class="status-chip settled">${settled.length} settled</span>
              </div>
            </div>
            <div class="panel-body ${sectionCollapsed.settledMarkets ? 'is-collapsed' : ''}">
              <div class="market-column">${settledHtml}</div>
            </div>
          </section>
          ${renderLogs()}
        </div>
      `;
    }

    function showConfigStatus(message, isError = false) {
      const el = document.getElementById('configStatus');
      if (!el) return;
      el.textContent = message;
      el.style.color = isError ? 'var(--bad)' : 'var(--accent)';
      if (configMessageTimeout) clearTimeout(configMessageTimeout);
      configMessageTimeout = setTimeout(() => {
        if (el.textContent === message) el.textContent = '';
      }, 3500);
    }

    function readConfigEditor() {
      const el = document.getElementById('configEditor');
      if (!el) return null;
      const raw = el.value.trim();
      if (!raw) return {};
      return JSON.parse(raw);
    }

    function bindConfigControls() {
      if (configPanelEl.dataset.bound === 'true') return;
      configPanelEl.dataset.bound = 'true';
      configPanelEl.addEventListener('click', (event) => {
        const button = event.target?.closest?.('[data-config-action]');
        if (!button) return;
        const action = button.getAttribute('data-config-action');
        if (action === 'reload') {
          const editor = document.getElementById('configEditor');
          if (editor) editor.value = JSON.stringify(state.config ?? {}, null, 2);
          showConfigStatus('Reloaded current runtime config.');
          return;
        }
        if (action === 'apply') {
          try {
            const next = readConfigEditor();
            ws?.send(JSON.stringify({ type: 'config:update', data: next }));
            showConfigStatus('Sent config update to runtime...');
          } catch (err) {
            showConfigStatus(`Config JSON error: ${err.message}`, true);
          }
        }
      });
    }

    function bindMarketSectionControls() {
      if (sectionsEl.dataset.bound === 'true') return;
      sectionsEl.dataset.bound = 'true';
      sectionsEl.addEventListener('click', (event) => {
        const copyBtn = event.target?.closest?.('[data-copy-slug]');
        if (copyBtn) {
          const slug = copyBtn.getAttribute('data-copy-slug') || '';
          copySlugToClipboard(slug, copyBtn);
          return;
        }
        const button = event.target?.closest?.('[data-panel-toggle]');
        if (!button) return;
        const sectionKey = button.getAttribute('data-panel-toggle');
        if (!Object.prototype.hasOwnProperty.call(sectionCollapsed, sectionKey)) return;
        sectionCollapsed[sectionKey] = !sectionCollapsed[sectionKey];
        scheduleRender('markets');
      });
    }

    function copySlugToClipboard(slug, button) {
      if (!slug) return;
      const markCopied = () => {
        const original = button.textContent;
        button.textContent = 'Copied';
        button.classList.add('copied');
        setTimeout(() => {
          button.textContent = original;
          button.classList.remove('copied');
        }, 1200);
      };
      const fallback = () => {
        try {
          const ta = document.createElement('textarea');
          ta.value = slug;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          markCopied();
        } catch (err) {
          /* noop */
        }
      };
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(slug).then(markCopied).catch(fallback);
      } else {
        fallback();
      }
    }

    function renderLogs() {
      const logs = Array.isArray(state.logs) ? state.logs : [];
      const content = logs.length
        ? logs.slice(0, 250).map((log) => `
            <div class="log-line ${log.level || 'info'}">
              <div>[${ts(log.timestamp)}] ${log.message || ''}</div>
            </div>
          `).join('')
        : `<div class="empty">Logs will appear here once the runtime starts talking.</div>`;
      return `
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2 class="panel-title">Logs</h2>
              <div class="panel-subtitle">Runtime events, buy attempts, and settlement notices.</div>
            </div>
            <div class="status-chip waiting">${logs.length}</div>
          </div>
          <div class="panel-body">
            <div class="log-list">${content}</div>
          </div>
        </section>
      `;
    }

    function scheduleRender(...keys) {
      if (keys.length === 0) {
        dirty.add('chrome');
        dirty.add('topStats');
        dirty.add('config');
        dirty.add('markets');
        dirty.add('logs');
      } else {
        keys.forEach((key) => dirty.add(key));
      }
      if (renderScheduled) return;
      renderScheduled = true;
      requestAnimationFrame(flushRender);
    }

    function flushRender() {
      renderScheduled = false;
      if (dirty.has('chrome')) {
        connectionEl.textContent = state.runtime.connected ? 'Live' : 'Waiting';
        runtimeLabelEl.textContent = state.runtime.dashboardUrl || 'Beat Runtime Dashboard';
        modeLabelEl.textContent = state.runtime.mode ? state.runtime.mode.toUpperCase() + ' MODE' : 'Beat Mode';
        dirty.delete('chrome');
      }
      if (dirty.has('topStats')) {
        renderTop();
        dirty.delete('topStats');
      }
      if (dirty.has('config')) {
        configPanelEl.innerHTML = renderConfig();
        bindConfigControls();
        dirty.delete('config');
      }
      if (dirty.has('markets')) {
        sectionsEl.innerHTML = renderMarkets();
        bindMarketSectionControls();
        dirty.delete('markets');
      }
      if (dirty.has('logs')) {
        sectionsEl.innerHTML = renderMarkets();
        bindMarketSectionControls();
        dirty.delete('logs');
      }
    }

    function handleEvent(type, data) {
      if (type === 'runtime') {
        state.runtime = { ...state.runtime, ...data };
        scheduleRender('chrome');
      } else if (type === 'config') {
        state.config = { ...state.config, ...data };
        scheduleRender('config');
      } else if (type === 'stats') {
        state.stats = { ...state.stats, ...data };
        scheduleRender('topStats');
      } else if (type === 'log') {
        state.logs = [data, ...state.logs].slice(0, 250);
        scheduleRender('logs');
      } else if (type === 'price') {
        const symbol = String(data?.symbol ?? 'BTC').toUpperCase();
        const source = String(data?.source ?? 'default').toLowerCase();
        const next = {
          symbol,
          source,
          price: data?.price != null && Number.isFinite(Number(data.price)) ? Number(data.price) : null,
          bestBid: data?.bestBid != null && Number.isFinite(Number(data.bestBid)) ? Number(data.bestBid) : null,
          bestAsk: data?.bestAsk != null && Number.isFinite(Number(data.bestAsk)) ? Number(data.bestAsk) : null,
          updatedAt: data?.updatedAt ?? Date.now(),
          isoTime: data?.isoTime || null,
        };
        if (!state.prices[symbol]) {
          state.prices[symbol] = {};
        }
        state.prices[symbol][source] = next;
        scheduleRender('topStats', 'markets');
      } else if (type === 'market') {
        const slug = data?.slug;
        if (slug) {
          const idx = state.markets.findIndex((item) => item.slug === slug);
          if (idx >= 0) {
            state.markets[idx] = { ...state.markets[idx], ...data };
          } else {
            state.markets = [data, ...state.markets].slice(0, 80);
          }
        }
        scheduleRender('topStats', 'markets');
      }
    }

    let ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.addEventListener('open', () => {
      state.runtime.connected = true;
      scheduleRender();
    });
    ws.addEventListener('close', () => {
      state.runtime.connected = false;
      scheduleRender('chrome');
    });
    ws.addEventListener('message', (event) => {
      let payload;
      try {
        payload = JSON.parse(event.data);
      } catch {
        return;
      }
      if (payload.type === 'snapshot') {
        Object.assign(state, payload.data);
        scheduleRender();
      } else if (payload.type === 'config:ack') {
        showConfigStatus('Config applied.');
      } else if (payload.type === 'error') {
        showConfigStatus(payload?.data?.message || 'Config update failed.', true);
      } else {
        handleEvent(payload.type, payload.data);
      }
    });

    setInterval(() => {
      if (state.markets.length) scheduleRender('topStats', 'markets');
    }, 1000);

    scheduleRender();
  </script>
</body>
</html>
