<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copy Trader Dashboard</title>
  <style>
    :root {
      --bg: #f4efe4;
      --panel: rgba(255,255,255,0.74);
      --panel-strong: rgba(255,255,255,0.9);
      --text: #16211d;
      --muted: #58645e;
      --accent: #0f766e;
      --accent-soft: #d7f3ee;
      --profit: #1d4ed8;
      --profit-soft: rgba(59,130,246,0.14);
      --loss-soft: rgba(180,35,24,0.12);
      --danger: #b42318;
      --warn: #9a6700;
      --shadow: 0 18px 50px rgba(34, 54, 45, 0.14);
      --radius: 20px;
      --border: rgba(15, 118, 110, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Aptos", "Segoe UI Variable", "Trebuchet MS", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(15,118,110,0.18), transparent 32%),
        radial-gradient(circle at top right, rgba(218,165,32,0.18), transparent 28%),
        linear-gradient(180deg, #fbf7ef 0%, var(--bg) 100%);
      min-height: 100vh;
    }
    .shell {
      max-width: 1400px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }
    .hero {
      display: grid;
      gap: 16px;
      margin-bottom: 20px;
      padding: 22px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255,255,255,0.78), rgba(237,250,247,0.88));
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    .hero h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.25rem);
      line-height: 1;
      letter-spacing: -0.04em;
    }
    .hero p {
      margin: 0;
      color: var(--muted);
      max-width: 68ch;
    }
    .banner {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 600;
    }
    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      margin-bottom: 18px;
    }
    .stat {
      padding: 18px;
      border-radius: var(--radius);
      background: var(--panel-strong);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
    }
    .stat .label {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .stat .value {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    .sections {
      display: grid;
      gap: 14px;
      grid-template-columns: minmax(0, 1fr);
    }
    .sections > * {
      min-width: 0;
    }
    details.panel {
      width: 100%;
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    details.panel[open] {
      background: var(--panel-strong);
    }
    details.panel > summary {
      list-style: none;
      cursor: pointer;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 700;
      font-size: 1rem;
    }
    details.panel > summary::-webkit-details-marker { display: none; }
    .summary-meta {
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 500;
    }
    .panel-body {
      padding: 0 20px 20px;
    }
    .cards {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .mini {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(15,118,110,0.08);
    }
    .mini .k {
      color: var(--muted);
      font-size: 0.8rem;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .mini .v {
      font-weight: 700;
      font-size: 1.15rem;
      overflow-wrap: anywhere;
    }
    .list {
      display: grid;
      gap: 10px;
    }
    .item {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.76);
      border: 1px solid rgba(15,118,110,0.08);
    }
    .item.settled-profit {
      background: linear-gradient(135deg, rgba(255,255,255,0.94), var(--profit-soft));
      border-color: rgba(29,78,216,0.28);
      box-shadow: inset 0 0 0 1px rgba(29,78,216,0.08);
    }
    .item.settled-loss {
      background: linear-gradient(135deg, rgba(255,255,255,0.94), var(--loss-soft));
      border-color: rgba(180,35,24,0.24);
      box-shadow: inset 0 0 0 1px rgba(180,35,24,0.08);
    }
    .item.settled-mismatch {
      border-color: rgba(154,103,0,0.34);
      box-shadow: inset 0 0 0 2px rgba(154,103,0,0.16);
    }
    .item header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-weight: 700;
    }
    .header-badges {
      display: inline-flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }
    .status-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 82px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: rgba(15,118,110,0.12);
      color: var(--accent);
    }
    .status-chip.profit {
      background: rgba(29,78,216,0.14);
      color: var(--profit);
    }
    .status-chip.loss {
      background: rgba(180,35,24,0.12);
      color: var(--danger);
    }
    .status-chip.mismatch {
      background: rgba(154,103,0,0.14);
      color: var(--warn);
    }
    .item dl {
      margin: 0;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 8px 12px;
    }
    .item dt {
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .item dd {
      margin: 0;
      font-family: "Consolas", "IBM Plex Mono", monospace;
      font-size: 0.92rem;
      overflow-wrap: anywhere;
    }
    pre.json {
      margin: 0;
      padding: 16px;
      border-radius: 16px;
      overflow: auto;
      background: #11201c;
      color: #e9fff8;
      font-family: "Consolas", "IBM Plex Mono", monospace;
      font-size: 0.84rem;
      line-height: 1.45;
    }
    .log-line {
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(15,118,110,0.08);
      font-family: "Consolas", "IBM Plex Mono", monospace;
      font-size: 0.84rem;
    }
    .log-line.info { border-left: 4px solid var(--accent); }
    .log-line.warn { border-left: 4px solid var(--warn); }
    .log-line.error { border-left: 4px solid var(--danger); }
    .muted { color: var(--muted); }
    .empty {
      padding: 18px;
      color: var(--muted);
      border: 1px dashed rgba(15,118,110,0.18);
      border-radius: 16px;
      background: rgba(255,255,255,0.46);
    }
    @media (max-width: 720px) {
      .shell { padding: 16px 12px 28px; }
      details.panel > summary { padding: 16px; }
      .panel-body { padding: 0 16px 16px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="banner">
        <span class="pill" id="connection">Connecting...</span>
        <span id="runtimeLabel">Copy Runtime Dashboard</span>
      </div>
      <h1>Real-time Copy Trader Control Room</h1>
      <p>Live runtime status, target trade flow, copy decisions, dry-run settlement tracking, and structured bot logs in one place.</p>
    </section>
    <section class="grid" id="topStats"></section>
    <section class="sections" id="sections"></section>
  </div>
  <script>
    const state = {
      runtime: {},
      config: {},
      stats: {},
      recentTrades: [],
      recentCopies: [],
      recentSkips: [],
      recentFailures: [],
      dryRun: { stats: {}, markets: [], recorded: [], settled: [] },
      logs: [],
    };

    const topStatsEl = document.getElementById('topStats');
    const sectionsEl = document.getElementById('sections');
    const connectionEl = document.getElementById('connection');
    const runtimeLabelEl = document.getElementById('runtimeLabel');
    const panelState = new Map();
    const sectionOrder = ['runtime', 'config', 'trades', 'copies', 'skips', 'failures', 'dryrun', 'logs'];
    const sectionSlots = new Map();
    const dirty = new Set(['chrome', 'topStats', ...sectionOrder]);
    let renderScheduled = false;

    function money(v) {
      const n = Number(v);
      return Number.isFinite(n) ? '$' + n.toFixed(2) : String(v ?? '-');
    }

    function ts(v) {
      if (!v) return '-';
      const d = new Date(v);
      if (Number.isNaN(d.getTime())) return String(v ?? '-');
      return d.toLocaleTimeString();
    }

    function dashIfEmpty(value) {
      return value == null || value === '' ? '-' : String(value);
    }

    function relSlug(item) {
      return item.slug || item.question || item.conditionId || 'Unknown market';
    }

    function dryRunMarketPnl(item) {
      const spent = item.copies.reduce((sum, copy) => sum + Number(copy.spent || 0), 0);
      const redeemed = Number(item.redeemed || 0);
      return {
        spent,
        redeemed,
        pnl: redeemed - spent,
      };
    }

    function trackedMarketView(item) {
      const copy = dryRunMarketPnl(item);
      const hasCopies = (item.copies?.length ?? 0) > 0;
      const traderSpent = Number(item.actualTraderSpent);
      const traderRedeemed = Number(item.actualTraderRedeemed);
      const traderPnl = Number(item.actualTraderPnl);
      return {
        hasCopies,
        spent: hasCopies ? copy.spent : (Number.isFinite(traderSpent) ? traderSpent : 0),
        redeemed: hasCopies ? copy.redeemed : (Number.isFinite(traderRedeemed) ? traderRedeemed : 0),
        pnl: hasCopies ? copy.pnl : (Number.isFinite(traderPnl) ? traderPnl : 0),
      };
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
    }

    function renderTopStats() {
      const cards = state.runtime.dryRun
        ? [
          ['Accepted Copies', state.stats.copies ?? 0],
          ['Skipped Signals', state.stats.skips ?? 0],
          ['Failures', state.stats.failures ?? 0],
          ['Live Spend', money(state.stats.totalSpent ?? 0)],
          ['Dry-run Open Cost', money(state.stats.dryRunOpenCost ?? 0)],
          ['Dry-run Settled PnL', money(state.stats.dryRunSettledPnl ?? 0)],
          ['My Settled PnL', money(state.stats.ownSettledPnl ?? 0)],
          ['Skipped Settled PnL', money(state.stats.skippedSettledPnl ?? 0)],
          ['Target Settled PnL', money(state.stats.targetSettledPnl ?? 0)],
        ]
        : [
          ['Accepted Copies', state.stats.copies ?? 0],
          ['Skipped Signals', state.stats.skips ?? 0],
          ['Failures', state.stats.failures ?? 0],
          ['Live Spend', money(state.stats.totalSpent ?? 0)],
          ['Tracked Markets Open', state.dryRun?.markets?.filter((item) => !item.settled).length ?? 0],
          ['Tracked Markets Settled', state.dryRun?.markets?.filter((item) => item.settled).length ?? 0],
          ['My Settled PnL', money(state.stats.ownSettledPnl ?? 0)],
          ['Skipped Settled PnL', money(state.stats.skippedSettledPnl ?? 0)],
          ['Target Settled PnL', money(state.stats.targetSettledPnl ?? 0)],
        ];
      topStatsEl.innerHTML = cards.map(([label, value]) => `
        <article class="stat">
          <div class="label">${label}</div>
          <div class="value">${value}</div>
        </article>
      `).join('');
    }

    function renderList(items, renderItem) {
      if (!items.length) return '<div class="empty">No events yet.</div>';
      return '<div class="list">' + items.map(renderItem).join('') + '</div>';
    }

    function initializeSections() {
      sectionsEl.innerHTML = sectionOrder
        .map((key) => `<div data-section-slot="${key}"></div>`)
        .join('');
      for (const key of sectionOrder) {
        sectionSlots.set(key, sectionsEl.querySelector(`[data-section-slot="${key}"]`));
      }
    }

    sectionsEl.addEventListener('toggle', (event) => {
      const panelEl = event.target.closest('details.panel[data-panel-key]');
      if (!panelEl) return;
      panelState.set(panelEl.dataset.panelKey, panelEl.open);
    }, true);

    function panel(key, title, meta, body, open = true) {
      const isOpen = panelState.has(key) ? panelState.get(key) : open;
      return `<details class="panel" data-panel-key="${key}" ${isOpen ? 'open' : ''}>
        <summary><span>${title}</span><span class="summary-meta">${meta}</span></summary>
        <div class="panel-body">${body}</div>
      </details>`;
    }

    function renderRuntimeSection() {
      return panel('runtime', 'Runtime Snapshot', state.runtime.mode ? state.runtime.mode.toUpperCase() : 'Runtime', `
        <div class="cards">
          <div class="mini"><div class="k">Mode</div><div class="v">${state.runtime.mode || 'copy'}</div></div>
          <div class="mini"><div class="k">Wallet</div><div class="v">${dashIfEmpty(state.runtime.wallet)}</div></div>
          <div class="mini"><div class="k">Dry Run</div><div class="v">${String(state.runtime.dryRun ?? false)}</div></div>
          <div class="mini"><div class="k">Started</div><div class="v">${ts(state.runtime.startedAt)}</div></div>
        </div>
      `);
    }

    function renderConfigSection() {
      return panel('config', 'Config', 'Current sizing, caps, and filters',
        '<pre class="json">' + escapeHtml(JSON.stringify(state.config, null, 2)) + '</pre>', false);
    }

    function renderTradesSection() {
      return panel('trades', 'Recent Target Trades', state.recentTrades.length + ' tracked',
        renderList(state.recentTrades, (item) => `
          <article class="item">
            <header><span>${relSlug(item)}</span><span>${ts(item.seenAt)}</span></header>
            <dl>
              <div><dt>Outcome</dt><dd>${dashIfEmpty(item.outcome)}</dd></div>
              <div><dt>Price</dt><dd>${item.price}</dd></div>
              <div><dt>Size</dt><dd>${item.size}</dd></div>
              <div><dt>USDC</dt><dd>${item.usdc}</dd></div>
              <div><dt>Target</dt><dd>${item.target}</dd></div>
              <div><dt>Tx</dt><dd>${dashIfEmpty(item.txHash)}</dd></div>
            </dl>
          </article>
        `));
    }

    function renderCopiesSection() {
      return panel('copies', 'Recent Copy Decisions', state.recentCopies.length + ' events',
        renderList(state.recentCopies, (item) => `
          <article class="item">
            <header><span>${relSlug(item)}</span><span>${item.dryRun ? 'DRY RUN' : 'LIVE'}</span></header>
            <dl>
              <div><dt>Outcome</dt><dd>${dashIfEmpty(item.outcome)}</dd></div>
              <div><dt>Shares</dt><dd>${item.shares}</dd></div>
              <div><dt>Max Price</dt><dd>${item.maxPrice}</dd></div>
              <div><dt>Assumed Spend</dt><dd>${money(item.assumedSpent)}</dd></div>
              <div><dt>Target Price</dt><dd>${item.targetPrice}</dd></div>
              <div><dt>Seen</dt><dd>${ts(item.timestamp)}</dd></div>
            </dl>
          </article>
        `));
    }

    function renderSkipsSection() {
      return panel('skips', 'Skipped Signals', state.recentSkips.length + ' recent reasons',
        renderList(state.recentSkips, (item) => `
          <article class="item">
            <header><span>${relSlug(item)}</span><span>${item.reason}</span></header>
            <dl>
              <div><dt>Phase</dt><dd>${dashIfEmpty(item.phase)}</dd></div>
              <div><dt>Outcome</dt><dd>${dashIfEmpty(item.outcome)}</dd></div>
              <div><dt>Price</dt><dd>${dashIfEmpty(item.price)}</dd></div>
              <div><dt>USDC</dt><dd>${dashIfEmpty(item.usdc)}</dd></div>
              <div><dt>Seen</dt><dd>${ts(item.timestamp)}</dd></div>
            </dl>
          </article>
        `), false);
    }

    function renderFailuresSection() {
      return panel('failures', 'Order Failures', state.recentFailures.length + ' recent failures',
        renderList(state.recentFailures, (item) => `
          <article class="item">
            <header><span>${relSlug(item)}</span><span>${ts(item.timestamp)}</span></header>
            <dl>
              <div><dt>Token</dt><dd>${dashIfEmpty(item.tokenId)}</dd></div>
              <div><dt>Outcome</dt><dd>${dashIfEmpty(item.outcome)}</dd></div>
              <div><dt>Error</dt><dd>${item.error}</dd></div>
            </dl>
          </article>
        `), false);
    }

    function renderDryRunSection() {
      return panel('dryrun', state.runtime.dryRun ? 'Dry-run Markets' : 'Tracked Target Markets', (state.dryRun.markets || []).length + ' tracked markets',
        renderList([...(state.dryRun.markets || [])].reverse(), (item) => {
          const market = trackedMarketView(item);
          const traderPnl = Number(item.actualTraderPnl);
          const ownPnl = Number(item.ownTraderPnl);
          const comparisonPnl = state.runtime.dryRun
            ? market.pnl
            : ownPnl;
          const hasMismatch = item.settled &&
            Number.isFinite(traderPnl) &&
            Number.isFinite(comparisonPnl) &&
            ((traderPnl > 0 && comparisonPnl < 0) || (traderPnl < 0 && comparisonPnl > 0));
          const statusClass = !item.settled
            ? ''
            : market.pnl > 0
              ? 'settled-profit'
              : market.pnl < 0
                ? 'settled-loss'
                : '';
          const cardClass = hasMismatch ? (statusClass + ' settled-mismatch').trim() : statusClass;
          const chipClass = !item.settled
            ? ''
            : market.pnl > 0
              ? 'profit'
              : market.pnl < 0
                ? 'loss'
                : '';
          const chipLabel = !item.settled
            ? 'Open'
            : market.pnl > 0
              ? 'Profit'
              : market.pnl < 0
                ? 'Loss'
                : 'Flat';
          return `
            <article class="item ${cardClass}">
              <header><span>${item.slug}</span><span class="header-badges"><span class="status-chip ${chipClass}">${chipLabel}</span>${hasMismatch ? '<span class="status-chip mismatch">Opposite Result</span>' : ''}</span></header>
              <dl>
                <div><dt>Question</dt><dd>${dashIfEmpty(item.question)}</dd></div>
                <div><dt>Copies</dt><dd>${item.copies.length}</dd></div>
                <div><dt>Spent</dt><dd>${money(market.spent)}</dd></div>
                <div><dt>Redeemed</dt><dd>${money(market.redeemed)}</dd></div>
                <div><dt>PnL</dt><dd>${money(market.pnl)}</dd></div>
                <div><dt>Trader PnL</dt><dd>${item.actualTraderPnl == null ? '-' : money(item.actualTraderPnl)}</dd></div>
                <div><dt>PnL Source</dt><dd>${dashIfEmpty(item.actualTraderPnlSource)}</dd></div>
                <div><dt>Trader Spend</dt><dd>${item.actualTraderSpent == null ? '-' : money(item.actualTraderSpent)}</dd></div>
                <div><dt>Trader Redeemed</dt><dd>${item.actualTraderRedeemed == null ? '-' : money(item.actualTraderRedeemed)}</dd></div>
                <div><dt>Trader Trades</dt><dd>${item.actualTraderTradeCount ?? 0}</dd></div>
                <div><dt>My PnL</dt><dd>${item.ownTraderPnl == null ? '-' : money(item.ownTraderPnl)}</dd></div>
                <div><dt>My Source</dt><dd>${dashIfEmpty(item.ownTraderPnlSource)}</dd></div>
                <div><dt>My Spend</dt><dd>${item.ownTraderSpent == null ? '-' : money(item.ownTraderSpent)}</dd></div>
                <div><dt>My Redeemed</dt><dd>${item.ownTraderRedeemed == null ? '-' : money(item.ownTraderRedeemed)}</dd></div>
                <div><dt>My Trades</dt><dd>${item.ownTraderTradeCount ?? 0}</dd></div>
                <div><dt>Skipped PnL</dt><dd>${item.skippedPnl == null ? '-' : money(item.skippedPnl)}</dd></div>
                <div><dt>Skipped Spend</dt><dd>${item.skippedSpent == null ? '-' : money(item.skippedSpent)}</dd></div>
                <div><dt>Skipped Redeemed</dt><dd>${item.skippedRedeemed == null ? '-' : money(item.skippedRedeemed)}</dd></div>
                <div><dt>Skipped Trades</dt><dd>${item.skippedTradeCount ?? 0}</dd></div>
                <div><dt>Settled At</dt><dd>${ts(item.settledAt)}</dd></div>
              </dl>
            </article>
          `;
        }));
    }

    function renderLogsSection() {
      return panel('logs', 'Live Logs', state.logs.length + ' recent lines',
        renderList(state.logs, (item) => `
          <div class="log-line ${item.level || 'info'}">
            [${dashIfEmpty(item.timestamp)}] ${item.level || 'info'}: ${escapeHtml(item.message || '')}
            ${item.meta && Object.keys(item.meta).length ? '<div class="muted">' + escapeHtml(JSON.stringify(item.meta)) + '</div>' : ''}
          </div>
        `));
    }

    const sectionRenderers = {
      runtime: renderRuntimeSection,
      config: renderConfigSection,
      trades: renderTradesSection,
      copies: renderCopiesSection,
      skips: renderSkipsSection,
      failures: renderFailuresSection,
      dryrun: renderDryRunSection,
      logs: renderLogsSection,
    };

    function updateRuntimeChrome() {
      connectionEl.textContent = state.runtime.connected ? 'Live' : 'Waiting';
      runtimeLabelEl.textContent = state.runtime.dashboardUrl || 'Copy Runtime Dashboard';
    }

    function renderSection(key) {
      const slot = sectionSlots.get(key);
      if (!slot) return;
      slot.innerHTML = sectionRenderers[key]();
    }

    function flushRender() {
      renderScheduled = false;
      if (dirty.has('chrome')) {
        updateRuntimeChrome();
        dirty.delete('chrome');
      }
      if (dirty.has('topStats')) {
        renderTopStats();
        dirty.delete('topStats');
      }
      for (const key of sectionOrder) {
        if (!dirty.has(key)) continue;
        renderSection(key);
        dirty.delete(key);
      }
    }

    function scheduleRender(...keys) {
      if (!keys.length) {
        dirty.add('chrome');
        dirty.add('topStats');
        for (const key of sectionOrder) dirty.add(key);
      } else {
        for (const key of keys) dirty.add(key);
      }
      if (renderScheduled) return;
      renderScheduled = true;
      requestAnimationFrame(flushRender);
    }

    function applySnapshot(snapshot) {
      Object.assign(state, snapshot);
      scheduleRender();
    }

    function handleEvent(payload) {
      const { type, data } = payload;
      if (type === 'runtime') {
        state.runtime = { ...state.runtime, ...data };
        scheduleRender('chrome', 'runtime', 'topStats', 'dryrun');
      } else if (type === 'stats') {
        state.stats = { ...state.stats, ...data };
        scheduleRender('topStats');
      } else if (type === 'config') {
        state.config = data;
        scheduleRender('config');
      } else if (type === 'trade') {
        state.recentTrades = [data, ...state.recentTrades].slice(0, 100);
        scheduleRender('trades');
      } else if (type === 'copy') {
        state.recentCopies = [data, ...state.recentCopies].slice(0, 100);
        scheduleRender('copies');
      } else if (type === 'skip') {
        state.recentSkips = [data, ...state.recentSkips].slice(0, 100);
        scheduleRender('skips');
      } else if (type === 'failure') {
        state.recentFailures = [data, ...state.recentFailures].slice(0, 100);
        scheduleRender('failures');
      } else if (type === 'dryRunSnapshot') {
        state.dryRun = data;
        scheduleRender('topStats', 'dryrun');
      } else if (type === 'dryRunRecorded') {
        state.dryRun.recorded = [data, ...(state.dryRun.recorded || [])].slice(0, 100);
        scheduleRender('dryrun');
      } else if (type === 'dryRunSettled') {
        state.dryRun.settled = [data, ...(state.dryRun.settled || [])].slice(0, 100);
        scheduleRender('dryrun');
      } else if (type === 'log') {
        state.logs = [data, ...state.logs].slice(0, 250);
        scheduleRender('logs');
      }
    }

    const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    ws.addEventListener('open', () => {
      state.runtime.connected = true;
      scheduleRender('chrome');
    });
    ws.addEventListener('close', () => {
      state.runtime.connected = false;
      scheduleRender('chrome');
    });
    ws.addEventListener('message', (event) => {
      const payload = JSON.parse(event.data);
      if (payload.type === 'snapshot') applySnapshot(payload.data);
      else handleEvent(payload);
    });

    initializeSections();
    scheduleRender();
  </script>
</body>
</html>
